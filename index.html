 code:`import javax.swing.*;
import javax.imageio.ImageIO;
import java.awt.*;
import java.awt.image.BufferedImage;
import java.io.File;

public class NewTest {

    public static void main(String[] args) throws Exception {

        JFrame frame = new JFrame("Bitmap Area Checkpoint");
        JPanel panel = new JPanel(new FlowLayout());

        panel.add(new JLabel("Google Search"));
        panel.add(new JTextField(25));
        panel.add(new JButton("Search"));

        frame.add(panel);
        frame.setSize(800, 600);
        frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);
        frame.setLocationRelativeTo(null);
        frame.setVisible(true);

        Thread.sleep(1000);

        BufferedImage fullImage = new BufferedImage(
            frame.getWidth(),
            frame.getHeight(),
            BufferedImage.TYPE_INT_RGB
        );

        Graphics2D g2 = fullImage.createGraphics();
        frame.paint(g2);
        g2.dispose();

        File folder = new File("SeleniumScreenshots");
        if (!folder.exists()) folder.mkdirs();

        int width = Math.min(800, fullImage.getWidth());
        int height = Math.min(600, fullImage.getHeight());

        BufferedImage currentArea =
            fullImage.getSubimage(0, 0, width, height);

        File currentFile =
            new File("SeleniumScreenshots/current_google_area.png");

        ImageIO.write(currentArea, "png", currentFile);

        System.out.println("Current screenshot saved:");
        System.out.println(currentFile.getAbsolutePath());

        File baselineFile =
            new File("SeleniumScreenshots/baseline_google_area.png");

        if (!baselineFile.exists()) {
            System.out.println("Baseline image not found.");
            System.out.println(
                "Rename current_google_area.png to baseline_google_area.png"
            );
        } else {
            BufferedImage baseline = ImageIO.read(baselineFile);

            double similarity =
                compareImages(baseline, currentArea);

            System.out.printf(
                "Image Similarity : %.2f%%%n",
                similarity
            );

            if (similarity >= 95)
                System.out.println("BITMAP CHECKPOINT : TEST PASS");
            else
                System.out.println("BITMAP CHECKPOINT : TEST FAIL");
        }

        Thread.sleep(2000);
        frame.dispose();
    }

    public static double compareImages(
            BufferedImage img1,
            BufferedImage img2) {

        if (img1.getWidth() != img2.getWidth()
            || img1.getHeight() != img2.getHeight())
            return 0;

        long totalPixels =
            (long) img1.getWidth() * img1.getHeight();

        long samePixels = 0;

        for (int x = 0; x < img1.getWidth(); x++) {
            for (int y = 0; y < img1.getHeight(); y++) {
                if (img1.getRGB(x, y) == img2.getRGB(x, y))
                    samePixels++;
            }
        }

        return ((double) samePixels / totalPixels) * 100;
    }
}`,

 ],
 code:`import java.sql.*;

public class DatabaseCheckpointCustomCheck {

    static final String DB_URL = "jdbc:sqlite:student.db";

    public static void setupDatabase() throws SQLException {

        try (Connection conn = DriverManager.getConnection(DB_URL);
             Statement stmt = conn.createStatement()) {

            stmt.execute(
                "CREATE TABLE IF NOT EXISTS students (" +
                "id INTEGER PRIMARY KEY, name TEXT, marks INTEGER)"
            );

            stmt.execute("DELETE FROM students");

            stmt.execute(
                "INSERT INTO students VALUES (1, 'Amit', 78)"
            );

            stmt.execute(
                "INSERT INTO students VALUES (2, 'Neha', 45)"
            );

            stmt.execute(
                "INSERT INTO students VALUES (3, 'Ravi', 92)"
            );
        }
    }

    public static boolean customCheckpoint(
            int studentId,
            String expectedStatus)
            throws SQLException {

        try (Connection conn =
                DriverManager.getConnection(DB_URL);
             PreparedStatement ps =
                conn.prepareStatement(
                    "SELECT marks FROM students WHERE id = ?"
                )) {

            ps.setInt(1, studentId);

            ResultSet rs = ps.executeQuery();

            if (!rs.next()) {
                System.out.println(
                    "FAIL: No record found for id " + studentId
                );
                return false;
            }

            int marks = rs.getInt("marks");

            String actualStatus =
                (marks >= 50) ? "Pass" : "Fail";

            if (actualStatus.equals(expectedStatus)) {

                System.out.println(
                    "PASS: Student " + studentId +
                    " status = " + actualStatus +
                    " (Custom check matched)"
                );

                return true;

            } else {

                System.out.println(
                    "FAIL: Student " + studentId +
                    " expected " + expectedStatus +
                    ", got " + actualStatus
                );

                return false;
            }
        }
    }

    public static void main(String[] args) throws Exception {

        setupDatabase();

        customCheckpoint(1, "Pass");
        customCheckpoint(2, "Fail");
        customCheckpoint(3, "Pass");
    }
}`,

                "INSERT INTO RUNTIME_RECORDS " +
                "(RUNTIME_VALUE) VALUES (?)";

            try (PreparedStatement insert =
                    con.prepareStatement(
                        insertSql,
                        Statement.RETURN_GENERATED_KEYS
                    )) {

                insert.setString(
                    1,
                    runtimeValue.toString()
                );

                insert.executeUpdate();

                try (ResultSet keys =
                        insert.getGeneratedKeys()) {

                    if (!keys.next()) {
                        System.out.println(
                            "TEST FAILED: No generated ID"
                        );
                        return;
                    }

                    generatedId = keys.getLong(1);
                }
            }

            String selectSql =
                "SELECT RUNTIME_VALUE " +
                "FROM RUNTIME_RECORDS " +
                "WHERE ID = ?";

            try (PreparedStatement select =
                    con.prepareStatement(selectSql)) {

                select.setLong(1, generatedId);

                try (ResultSet rs =
                        select.executeQuery()) {

                    if (!rs.next()) {
                        System.out.println(
                            "TEST FAILED: Runtime record not found"
                        );
                        return;
                    }

                    String actualValue =
                        rs.getString("RUNTIME_VALUE");

                    String expectedValue =
                        runtimeValue.toString();

                    System.out.println(
                        "Record ID : " + generatedId
                    );

                    System.out.println(
                        "Expected Runtime Value : "
                        + expectedValue
                    );

                    System.out.println(
                        "Actual Runtime Value   : "
                        + actualValue
                    );

                    if (expectedValue.equals(actualValue)) {
                        System.out.println(
                            "DATABASE CHECKPOINT : PASS"
                        );
                    } else {
                        System.out.println(
                            "DATABASE CHECKPOINT : FAIL"
                        );
                    }
                }
            }

        } catch (Exception e) {
            System.out.println(
                "DATABASE CHECKPOINT : ERROR"
            );
            e.printStackTrace();
        }
    }
}`,

const nav = document.getElementById("nav");
const content = document.getElementById("content");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function block(label, value) {
  if (!value) return "";
  return `<div class="code-card">
    <div class="code-top">
      <span class="code-label">${label}</span>
      <button class="copy" onclick="copyCode(this)">Copy</button>
    </div>
    <pre><code>${esc(value)}</code></pre>
  </div>`;
}

experiments.forEach(e => {
  nav.insertAdjacentHTML("beforeend",
    `<a href="#${e.id}" data-target="${e.id}">${esc(e.num)} — ${esc(e.title)}</a>`
  );

  const steps = e.steps.map(x => `<li>${esc(x)}</li>`).join("");

  content.insertAdjacentHTML("beforeend", `
    <section class="experiment" id="${e.id}" data-search="${esc((e.num+" "+e.title+" "+e.question+" "+e.steps.join(" ")+" "+(e.code||"")).toLowerCase())}">
      <div class="exp-head">
        <div class="num">${esc(e.num)}</div>
        <div><h2>${esc(e.title)}</h2></div>
      </div>

      <div class="question">
        <strong>Question</strong><br>${esc(e.question)}
      </div>

      <h3>Steps</h3>
      <ol class="steps">${steps}</ol>

      ${e.code ? `<h3>Answer</h3>${block("Code", e.code)}` : `<h3>Answer</h3><div class="missing">${esc(e.note || "No code provided.")}</div>`}
      ${e.output ? `<h3>Expected Output</h3>${block("Output", e.output)}` : ""}
      ${e.note && e.code ? `<div class="note">${esc(e.note)}</div>` : ""}
    </section>
  `);
});

window.copyCode = async function(button) {
  const code = button.closest(".code-card").querySelector("code").innerText;
  try {
    await navigator.clipboard.writeText(code);
    const old = button.textContent;
    button.textContent = "Copied!";
    setTimeout(() => button.textContent = old, 1200);
  } catch {
    button.textContent = "Copy failed";
    setTimeout(() => button.textContent = "Copy", 1200);
  }
};

const layout = document.getElementById("layout");
const menuBtn = document.getElementById("menuBtn");
const themeBtn = document.getElementById("themeBtn");

const savedTheme = localStorage.getItem("stm-theme") || "dark";
document.documentElement.dataset.theme = savedTheme;
themeBtn.textContent = savedTheme === "light" ? "☾" : "☼";

menuBtn.addEventListener("click", () => {
  layout.classList.toggle("sidebar-closed");
  localStorage.setItem(
    "stm-sidebar",
    layout.classList.contains("sidebar-closed") ? "closed" : "open"
  );
});

if (localStorage.getItem("stm-sidebar") === "closed") {
  layout.classList.add("sidebar-closed");
}

themeBtn.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("stm-theme", next);
  themeBtn.textContent = next === "light" ? "☾" : "☼";
});
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      document.querySelectorAll(".nav a").forEach(a => a.classList.remove("active"));
      const a = document.querySelector(`.nav a[data-target="${entry.target.id}"]`);
      if (a) a.classList.add("active");
    }
  });
}, { rootMargin: "-20% 0px -65% 0px" });

document.querySelectorAll(".experiment").forEach(x => observer.observe(x));
